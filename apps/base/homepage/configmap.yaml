apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Home
    theme: dark
    color: slate
    background:
      image: data:image/svg+xml;base64,
      blur: sm
      saturate: 115
      brightness: 55
      opacity: 85
  custom.css: |
    body {
      background-color: #0f172a;
    }
  bookmarks.yaml: |
    - Developer:
        - Homelab Repo:
            - abbr: GH
              href: https://github.com/lukadimnik/homelab
        - Cloudflare:
            - abbr: CF
              href: https://dash.cloudflare.com/
  services.yaml: |
    - Personal:
        - Website:
            icon: mdi-web
            href: https://lukadimnik.com/
            description: Personal website
            ping: https://lukadimnik.com/
    - Infrastructure:
        - Grafana:
            icon: grafana.png
            href: http://grafana.lukadimnik.com/
            description: Metrics & dashboards
            ping: http://grafana.lukadimnik.com/
    - Apps:
        - Linkding:
            icon: linkding.png
            href: https://linkdinghp.lukadimnik.com/
            description: Bookmark manager
            ping: https://linkdinghp.lukadimnik.com/
        - Audiobookshelf:
            icon: audiobookshelf.png
            href: http://audiobookshelfhp.lukadimnik.com/
            description: Audiobook & podcast server
            ping: http://audiobookshelfhp.lukadimnik.com/
  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Welcome, Luka
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
