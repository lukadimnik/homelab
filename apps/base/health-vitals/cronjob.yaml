apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-sync
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: health-sync
              image: ghcr.io/lukadimnik/health-vitals:0.1.0
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: health-vitals-db-app
                      key: uri
              envFrom:
                - secretRef:
                    name: google-oauth-credentials
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
