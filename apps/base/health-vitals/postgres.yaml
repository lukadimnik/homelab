apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: health-vitals-db
spec:
  managed:
    roles:
      - name: grafana
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret:
          name: grafana-db-credentials
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
  storage:
    size: 1Gi
  # Continuous WAL archiving + base backups via the Barman Cloud plugin.
  # The ObjectStore itself is environment-specific (apps/staging/health-vitals).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-object-storage
  bootstrap:
    initdb:
      database: health_vitals
      owner: health_vitals
