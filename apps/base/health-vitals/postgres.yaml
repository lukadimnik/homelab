apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: health-vitals-db
spec:
  managed:
    roles:
      - name: grafana
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret:
          name: grafana-db-credentials
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: health_vitals
      owner: health_vitals
