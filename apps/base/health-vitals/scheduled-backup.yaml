apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: health-vitals-db-daily
spec:
  cluster:
    name: health-vitals-db
  # CNPG uses 6-field cron (seconds first): every day at 03:00.
  schedule: "0 0 3 * * *"
  # Take the first base backup right away instead of waiting for 03:00.
  immediate: true
  # Backup objects are owned by this ScheduledBackup and cleaned up with it.
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
