apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg
spec:
  interval: 30m
  # The plugin's Certificates/Issuer need cert-manager's CRDs and webhook,
  # and the plugin itself registers with the CNPG operator.
  dependsOn:
    - name: cnpg
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg
      interval: 12h
  driftDetection:
    mode: enabled
